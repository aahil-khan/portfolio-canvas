<!doctype html>
<meta charset="utf-8">
<title>prototype — fullscreen shot viewer</title>
<style>
:root{
  --canvas-base:#F7F5EE; --surface:#FFFFFF; --surface-alt:#FDF7C4; --surface-sunken:#F4F2EA;
  --ink:#161616; --ink-muted:rgba(22,22,22,.62); --ink-subtle:rgba(22,22,22,.45);
  --accent:#FACC00; --accent-ink:#161616; --border:#161616; --border-width:2px;
  --shadow-hard:4px 4px 0 0 var(--border); --shadow-hard-lg:6px 6px 0 0 var(--border);
  --radius-window:12px; --ease-out:cubic-bezier(.16,1,.3,1);
  --c:#A8E6A1; --on-app:#161616;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:'Space Grotesk',system-ui,sans-serif; color:var(--ink);
  background:
    radial-gradient(circle at 50% 8%,rgba(255,255,255,.75),transparent 34%),
    radial-gradient(circle at 20% 18%,rgba(255,255,255,.35),transparent 28%),
    linear-gradient(180deg,#FBFAF6 0%,#F7F5EE 36%,#F1EFE6 100%);
}
/* a stand-in for the canvas behind the overlay */
.bg-card{
  position:absolute; left:60px; top:70px; width:560px; background:var(--surface);
  border:var(--border-width) solid var(--border); border-radius:var(--radius-window);
  box-shadow:var(--shadow-hard-lg); rotate:.8deg; overflow:hidden;
}
.bg-card__head{background:var(--c); border-bottom:var(--border-width) solid var(--border);
  padding:9px 12px; font-size:.9375rem; font-weight:500; letter-spacing:-.005em}
.bg-card__body{padding:18px 20px; font-size:.9375rem; line-height:1.6; color:var(--ink-muted)}

/* ---------- the thing being proven ---------- */
.lb{position:fixed; inset:0; z-index:400; display:grid; place-items:center; padding:32px}
.lb__scrim{position:absolute; inset:0; border:0; padding:0; cursor:default}
body[data-scrim="cream"] .lb__scrim{
  background:color-mix(in srgb, var(--canvas-base) 55%, transparent);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
body[data-scrim="ink"] .lb__scrim{
  background:color-mix(in srgb, var(--ink) 66%, transparent);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
/* the viewer is a window, like everything else on this desktop */
.lb__win{
  position:relative; display:flex; flex-direction:column;
  max-width:min(1280px, calc(100vw - 64px)); max-height:calc(100vh - 64px);
  background:var(--surface); border:var(--border-width) solid var(--border);
  border-radius:var(--radius-window); box-shadow:var(--shadow-hard-lg); overflow:hidden;
}
.lb__head{
  display:flex; align-items:center; gap:10px; flex:0 0 auto;
  background:var(--c); border-bottom:var(--border-width) solid var(--border); padding:9px 12px;
}
.lb__title{font-size:.9375rem; font-weight:500; letter-spacing:-.005em; margin-right:auto}
.lb__count{
  font-size:10px; font-weight:700; letter-spacing:.04em; padding:3px 7px; border-radius:999px;
  background:rgba(255,255,255,.55); border:1.5px solid var(--border);
}
.lb__x{
  width:22px; height:22px; flex:0 0 auto; border-radius:999px; padding:0; position:relative;
  background:rgba(255,255,255,.55); border:1.5px solid var(--border); cursor:pointer;
  transition:background .14s var(--ease-out);
}
.lb__x::before,.lb__x::after{
  content:''; position:absolute; left:50%; top:50%; width:9px; height:1.5px;
  background:var(--on-app); border-radius:1px;
}
.lb__x::before{transform:translate(-50%,-50%) rotate(45deg)}
.lb__x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.lb__x:hover{background:#fff}

.lb__stage{position:relative; flex:1; min-height:0; display:grid; place-items:center;
  background:var(--surface-sunken); padding:14px}
.lb__stage img{display:block; max-width:100%; max-height:calc(100vh - 190px);
  width:auto; height:auto; object-fit:contain;
  border:1.5px solid var(--border); border-radius:8px}
.lb__arrow{
  position:absolute; top:50%; translate:0 -50%; width:36px; height:36px; display:grid;
  place-items:center; padding:0; border-radius:999px; cursor:pointer;
  background:rgba(255,255,255,.55); border:1.5px solid var(--border); color:var(--ink);
  transition:background .14s var(--ease-out);
}
.lb__arrow:hover{background:#fff}
.lb__arrow--prev{left:14px}
.lb__arrow--next{right:14px; rotate:180deg}
.lb__dots{display:flex; gap:6px; justify-content:center; padding:10px;
  border-top:var(--border-width) solid var(--border); background:var(--surface)}
.lb__dots button{width:7px; height:7px; padding:0; border-radius:999px; cursor:pointer;
  border:1.5px solid var(--border); background:transparent}
.lb__dots button.is-on{background:var(--accent); width:18px}
.hint{position:fixed; left:14px; bottom:12px; z-index:401; font-size:11px; color:var(--ink-subtle)}
</style>
<body data-scrim="cream">
<div class="bg-card">
  <div class="bg-card__head">◈ SOP Opera</div>
  <div class="bg-card__body">A compound-risk engine that catches the hazard no single sensor is looking for.</div>
</div>

<div class="lb">
  <button class="lb__scrim" aria-label="Close"></button>
  <div class="lb__win">
    <div class="lb__head">
      <span class="lb__title">SOP Opera screenshot</span>
      <span class="lb__count">1 / 3</span>
      <button class="lb__x" aria-label="Close"></button>
    </div>
    <div class="lb__stage">
      <img src="../public/work/sop-opera-1.webp" alt="">
      <button class="lb__arrow lb__arrow--prev"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="lb__arrow lb__arrow--next"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
    </div>
    <div class="lb__dots">
      <button class="is-on"></button><button></button><button></button>
    </div>
  </div>
</div>
<div class="hint">?scrim=ink to compare · esc closes</div>
<script>
  const p = new URLSearchParams(location.search).get('scrim')
  if (p) document.body.dataset.scrim = p
</script>
