<!doctype html>
<html lang="en" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab kit — desk sandbox</title>
<!--
  DESIGN GATE — prototype/lab/desk.html (kit sandbox)

  The bare desk from shared/desk.js, with nothing of the Lab on it, so the two directions
  (sky-beyond/, night-mode/) start from the same canvas. What is being judged: does it feel like
  the live /canvas — floor, cards, dock, pan, zoom about the cursor, pinch, drag a card by its
  title bar, fly to a card from the dock. The Lab tile (new, after Contact) flies to the deep-space
  card at eggs.ts's 3800,-2400, which is where Direction 1 puts the Lab's door.

  Throwaway: the readout in the corner, which only proves DESK.onFrame fires.
  ?theme=jet opens the proposed jet canvas theme; the pill's Theme button toggles it.
-->
<link rel="stylesheet" href="shared/jet.css">
<link rel="stylesheet" href="shared/desk.css">
<script src="shared/pieces.js"></script>
<script src="shared/sky.js"></script>
<style>
  .readout {
    position: fixed; left: 20px; bottom: calc(var(--dock-bottom) + 12px); z-index: 60; margin: 0;
    font-size: 0.75rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-subtle);
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  @media (max-width: 700px) { .readout { top: 64px; bottom: auto; left: 50%; transform: translateX(-50%); } }
</style>
</head>
<body>
<p class="readout" aria-live="off"></p>
<script src="shared/desk.js"></script>
<script>
  const theme = new URLSearchParams(location.search).get('theme') === 'jet' ? 'jet' : 'cream'
  DESK.mount({ theme, publicRoot: '../../public' })
  const out = document.querySelector('.readout')
  DESK.onFrame((cam, v) => { out.textContent = `centre ${Math.round(v.cx)}, ${Math.round(v.cy)} · ${Math.round(cam.s * 100)}%` })
</script>
</body>
</html>
