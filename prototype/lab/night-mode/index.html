<title>Lab: night mode</title>
<!--
  DESIGN GATE: prototype/lab/night-mode/index.html (Direction 2, "Night mode", revised: the Lab
  as a terminal)

  The Lab tile in the dock turns the desk to night, and at night the desk is the Lab: everything
  changes to say you have left the desk. As dusk settles the UI decodes into a terminal: the dock
  becomes a row of bracketed glyphs, a prompt ($ cd ~/desk) is the way back, the stars are ASCII,
  and three panes open out of the Lab tile: ~/lab/work, ~/lab/experiments, ~/lab/writing. Back to
  the desk re-encodes it all and every day card lands exactly where it was.

  The Lab holds only the serious work. The fun stuff (scraps, found, the Arcade) stays on the
  desk. Write-ups are blog posts: [read] or a writing row grows into a full-page reader.

  What is being judged:
    - does the Lab read as somewhere else, while the day desk is exactly as it was?
    - the three panes: specimens, a lab log, a list of posts
    - the reader: opening out of the row and closing back into it; reading at 64ch
    - the three palettes, by eye (the switch at the top right is throwaway)
    - on a phone: one pane at a time, switched by ASCII tabs
  Throwaway: the ✓ readout, the palette switch, and the URL switches that make screenshots
  repeatable:
    ?mode=night (or ?lab=1)   land in the Lab, as /lab would     &palette=green|amber
    #/writing/<slug>          a post, deep-linked (lands in the Lab with it open)
    &tab=experiments          phone: which pane shows            &open=<slug>   an experiment's window
    &then=desk                land in the Lab, go back, measure every day card
    ?freeze=<0..1>            hold the transition there          ?enter=1  play it once on load
    ?roundtrip=1              drag a card, pan, Lab and back, then measure every card
    &add=1                    the 20th-piece proof. By hand: LAB.pieces.push({...}); renderShelves()
  Content comes only from ../shared/pieces.js (filtered here: no kit edit) and work.js (projects.json,
  transcribed and checked); desk.js is the canvas engine, sky.js the reduced-motion owner.
-->
