<!doctype html>

<title>Lab: its own screen</title>
<!--
  DESIGN GATE: prototype/lab/night-mode/index.html (Direction 2, "Night mode", third round: the
  Lab as its own screen). Supersedes #17.

  The Lab tile in the dock turns the desk to night, as before. Then the desk is gone: the Lab is
  a fixed screen of its own, with nothing to pan, zoom or drag. A status bar (aahil@lab, where
  you are, the time, and [← canvas ~]); a random ASCII effect on every visit, the welcome typing
  on, and then the Lab's home: a TUI split, a tree of ~/lab on the left and a live preview of the
  highlighted row on the right. The dock holds only the Lab: [← canvas], work, experiments,
  writing, gh, in. A post or a log opens in the reader, which grows out of the row (#17's motion).

  What is being judged:
    - does the Lab read as somewhere else, built for the serious work, while the desk is as it was?
    - the intro: six effects, one per visit, ~2.8 s, any key or click skips it
    - the menu: keyboard (↑↓ ↵ esc 1 2 3 ~) and mouse; on a phone, a list and a detail
    - the reader: the framed header, the contents, the figures, prev / next
    - the three palettes, by eye (the switch in the status bar is throwaway)
  Throwaway: the ✓ readout, the palette switch, and the URL switches that make screenshots
  repeatable:
    ?mode=night (or ?lab=1)   land in the Lab, as /lab would (the intro still plays)
    &fx=<id>                  torus | warp | nebula | life | resolve | moonrise
    &hold=<ms>                hold the intro at that moment       &intro=0   no intro
    &sel=<section/slug>       highlight a row                     &view=detail  phone: its detail
    &palette=green|amber
    #/writing/<slug>, #/experiments/<slug>   a post or a log, deep-linked, open over the Lab
    &toc=<section>  scroll the post to a section    &fig=<n>  enlarge figure n
    &then=desk                land in the Lab, go back, measure every day card
    ?freeze=<0..1>            hold the transition there          ?enter=1  play it once on load
    ?roundtrip=1              drag a card, pan, Lab and back, then measure every card
    #/writing/old-laptop-cloud the long post: the essay's real headings and figures (essay.js)
    &add=1                    the 20th-piece proof. By hand: LAB.pieces.push({...}); renderLab()
  Content comes only from ../shared/pieces.js (filtered: no kit edit) and work.js (projects.json,
  transcribed and checked); every UI word is in copy.js. desk.js is the canvas engine, sky.js the
  reduced-motion owner.
-->
