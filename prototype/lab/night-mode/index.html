<!doctype html>

<title>Lab: three layouts</title>
<!--
  DESIGN GATE: prototype/lab/night-mode/index.html (Direction 2, "Night mode", fourth round: the
  layout rethought). Supersedes #18.

  The Lab tile turns the desk to night, now in 0.7 s, and the Lab is a fixed screen of its own,
  with nothing to pan, zoom or drag. No status bar and no boxed panels: one small ← canvas (top
  left), the welcome beside a small ASCII toy (top right: a random one each visit, [next] cycles,
  drag or point at it), and the work, in one of three layouts to compare by eye:
    index  a thin text index on the left, the highlighted entry read to its right (the default)
    dock   the dock is the only navigation; one section as a full-width list, entries expand
    page   one editorial page that scrolls, with a tiny sticky jump line
  A post or a log opens in the reader, which grows out of the row (#17's motion, #18's page).

  What is being judged:
    - the three layouts, side by side (the layout switch, bottom right, flips them live)
    - the trip: about 0.7 s in, 0.6 s back, decode included
    - the toy: donut, warp, life, nebula, moon; does it earn its corner?
    - the reader, as in #18
  Throwaway: the ✓ readout, the layout and palette switches, and the URL switches that make
  screenshots repeatable:
    ?mode=night (or ?lab=1)   land in the Lab, as /lab would
    &layout=index|dock|page   which layout                     &palette=green|amber
    &fx=<id>                  donut | warp | life | nebula | moon (else a random one)
    &sel=<section/slug>       highlight (index) or expand (dock) an entry, or scroll to it (page)
    &view=detail              phone, index layout: that entry's detail
    #/writing/<slug>, #/experiments/<slug>   a post or a log, deep-linked, open over the Lab
    &toc=<section>  scroll the post to a section    &fig=<n>  enlarge figure n
    &then=desk                land in the Lab, go back, measure every day card
    ?freeze=<0..1>            hold the transition there          ?enter=1  play it once on load
    ?roundtrip=1              drag a card, pan, Lab and back, measure every card and both trips
    &add=1                    the 20th-piece proof. By hand: LAB.pieces.push({...}); renderLab()
  Content comes only from ../shared/pieces.js (filtered: no kit edit), work.js (projects.json,
  transcribed and checked) and essay.js (the two Medium essays, imported); every UI word is in
  copy.js. desk.js is the canvas engine, sky.js the reduced-motion owner.
-->
