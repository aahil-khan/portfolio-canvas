<title>Lab: directory and deck</title>
<!--
  DESIGN GATE: prototype/lab/night-mode/index.html (Direction 2, "Night mode", fifth round: the
  directory home, the deck, series, voices). Supersedes #19, built on its `dock` layout.

  The Lab tile turns the desk to night in 0.7 s. The Lab is a fixed screen of its own, with
  nothing to pan, zoom or drag: the welcome beside the ASCII toy, then THE DIRECTORY (an ls-style
  listing of work/ experiments/ research/ writing/, each expanding in place), and THE DECK: the
  desk's dock, morphed into one status line of controls. The deck is not navigation.

  What is being judged:
    - the directory home, and the four categories' one-line descriptions (copy.js: proposals)
    - the deck: mode · transport · voice · flags · toy · ?ask /cmd ?keys · ← canvas
    - the series: research/the reliability study (SAMPLE CONTENT: PLACEHOLDER), hub and chapters
    - narration: one section of one essay, word by word, in ai / synth / sam (me — soon)
    - ?ask, the / command line, the terminal cues (muted on arrival)
    - the compass, EXPERIMENTAL: ?home=radial or radial:on in the deck
  Throwaway: the ✓ readout and the URL switches that make screenshots repeatable:
    ?mode=night (or ?lab=1)   land in the Lab, as /lab would
    &palette=green|amber      &fx=<id>  donut | warp | life | nebula | moon
    &home=radial              the compass       &voice=ai|synth|sam    the voice picked
    &sel=<category/slug>      open a category (and expand an entry)
    &pop=voice|knobs|ask|cmd|help|more   a popover open on arrival (never ▸: nothing autoplays)
    #/writing/<slug>, #/experiments/<slug>, #/research/<slug>   a post, a log, a hub or a chapter
    &toc=<section>  scroll the post to a section    &fig=<n>  enlarge figure n
    &then=desk                land in the Lab, go back, measure every day card
    ?freeze=<0..1>            hold the transition there          ?enter=1  play it once on load
    ?roundtrip=1              drag a card, pan, Lab and back, measure every card and both trips
    &add=1                    the 20th-piece proof. By hand: LAB.pieces.push({...}); renderLab()
  Content: ../shared/pieces.js (filtered: no kit edit), work.js, essay.js (the two Medium essays)
  and series.js (the placeholder study); every UI word is in copy.js. desk.js is the canvas
  engine, sky.js the reduced-motion owner, sound.js the one mute, voice.js the one narrator.
  sam.js is SAM (1982), vendored, no licence (see its header): https://github.com/discordier/sam
-->
