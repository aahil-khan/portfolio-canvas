<title>lab</title>
<!--
  DESIGN GATE: prototype/lab/notebook/index.html, the Lab as a notebook ("Obsidian, my own
  flavour"). Supersedes #21. Plan: ~/.local/state/hq/plans/portfolio-canvas/lab-notebook-plan-the/.

  A reader-first notebook: a top bar (← canvas, the note's path, ⌕ ◎ ▶ ◫), the vault tree on the
  left (a drawer on phone), a ~64-character reading column that scrolls, and a right margin with
  only "on this page" (≥ 3 headings; otherwise the column centres). Links, backlinks, the local
  graph and the tags sit at each note's end. f is focus mode. Two reading themes, night and
  paper (Aa in the bar holds them with text size, line width, focus and sounds; a direct link follows
  prefers-color-scheme, the trip is night; prefs.js). Round 4 adds the reader's controls (controls.js,
  glossary.js): progress and time left, the glossary, links to headings, share, previews, resume, print. Round 5 adds motion
  (motion.js): a crossfade between notes, soft hover, panes and a drawer that slide, the strip's row, the graph's
  easing; all on DIRECTION's one easing, with reduced-motion fallbacks. Round 1 of the readability fixes:
  ~/.local/state/hq/plans/portfolio-canvas/lab-audit-readability-first/plan.md; audit.mjs measures it. Every note has a stable URL. The canvas trip is still
  here (#desk, then the Lab tile or L), and secondary.

  URL switches (throwaway, for checking):
    #/<path>, #/T02, #/PW1, #/W1     a note, a short link        #/graph   the full graph
    ?w=W1                            tour context                 ?a=p2     a heading or row
    #desk                            start on the canvas          &pop=switcher|drawer|help
    ?freeze=<0..1>[&back=1]          hold the trip at t           ?enter=1  play it once
    ?roundtrip=1                     drag a card, pan, Lab and back, measure every card
    ?theme=night|paper|green|amber   ?voice=ai|sam|synth          ?autolink=0   ?hidden=1
    (one visit, not stored; ?palette= is the same switch)
    ?add=1                           a 72nd note, relaid out warm; the readout says how far
  Content: notes/**.md (vault.js), the tracker's public parts (study.js), the two essays
  (essay.js). Every UI word is in copy.js. sam.js is SAM (1982), vendored, no licence (see its
  header). One file to open: node bundle.mjs writes all of this, inlined, to one lab.html.
-->
