<title>Lab: living tiles</title>
<!--
  DESIGN GATE: prototype/lab/night-mode/index.html (Direction 2, "Night mode", sixth round: living
  tiles, a quiet deck, the ask hero, a small dial). Supersedes #20.

  The Lab tile turns the desk to night in 1.2 s (and back in 1.2 s). The Lab is a fixed screen of
  its own, with nothing to pan, zoom or drag: ← canvas top left; the welcome beside the ASCII toy
  (its [next] beside it); the ask hero, ▶ what am i working on?, with two smaller prompts; then
  THE LIVING TILES, work/ experiments/ research/ writing/, each with a small looping vignette.
  THE DECK is the desk's dock, morphed into one short line: LAB │ snd pal │ / ? at rest, with the
  transport and the voice sliding in only while something plays. The deck is not navigation.

  What is being judged:
    - the tiles: vignettes, wake on hover / focus, the peek; an open category (glyphs, preview)
    - the ask hero, and the deck at rest and while it talks
    - the dial, EXPERIMENTAL: ?dial=1, or `experimental dial:on` under ?
    - the series: research/the reliability study (SAMPLE CONTENT: PLACEHOLDER), hub and chapters
    - narration: one section of one essay, word by word, in ai / synth / sam (me — soon)
  Throwaway: the ✓ readout and the URL switches that make screenshots repeatable:
    ?mode=night (or ?lab=1, or #lab)   land in the Lab, as /lab would
    &palette=green|amber      &fx=<id>  donut | warp | life | nebula | moon
    &dial=1                   the experimental dial     &voice=ai|synth|sam    the voice picked
    &sel=<category/slug>      open a category (and show an entry)
    &pop=voice|knobs|cmd|help a popover open on arrival (never ▸: nothing autoplays)
    #/writing/<slug>, #/experiments/<slug>, #/research/<slug>   a post, a log, a hub or a chapter
    &toc=<section>  scroll the post to a section    &fig=<n>  enlarge figure n
    &then=desk                land in the Lab, go back, measure every day card
    ?freeze=<0..1>[&back=1]   hold the transition there (the way in, or the way back)
    ?enter=1                  play it once on load
    ?roundtrip=1              drag a card, pan, Lab and back, measure every card and both trips
    &add=1                    the 20th-piece proof. By hand: LAB.pieces.push({...}); renderLab()
  Content: ../shared/pieces.js (filtered: no kit edit), work.js, essay.js (the two Medium essays)
  and series.js (the placeholder study); every UI word is in copy.js. desk.js is the canvas
  engine, sky.js the reduced-motion owner, sound.js the one mute, voice.js the one narrator.
  sam.js is SAM (1982), vendored, no licence (see its header): https://github.com/discordier/sam
  One file to open: node bundle.mjs writes all of this, inlined, to a single lab.html.
-->
