<!doctype html>
<html lang="en-GB" data-look="paper" data-theme="cream">

<title>Lab extras · the surfaces the mockup never drew</title>

<script>
// The one owner of the view and the look, before first paint. Query params only:
//   ?view=<id>   one of VIEWS below; none = the index of every view
//   ?look=paper|premium  ?theme=cream|tokyo-night (Paper and the site)  ?mode=day|night (Premium)
//   ?bare        hides the mockup's corner tag, for screenshots and the check
(function () {
  var q = new URLSearchParams(location.search), h = document.documentElement;
  var view = q.get('view') || 'index';
  var family = { 'site-nav': 'site', 'site-band': 'site', 'site-contrib': 'site', 'canvas-lab': 'site' }[view] || 'lab';
  var look = family === 'lab' && q.get('look') === 'premium' ? 'premium' : 'paper';
  var theme = q.get('theme') === 'tokyo-night' ? 'tokyo-night' : 'cream';
  if (view === 'index' || view === 'cards') { look = 'paper'; theme = 'cream'; }
  h.setAttribute('data-view', view);
  h.setAttribute('data-look', look);
  if (look === 'premium') { h.removeAttribute('data-theme'); h.setAttribute('data-mode', q.get('mode') === 'day' ? 'day' : 'night'); }
  else h.setAttribute('data-theme', theme);
  if (q.has('bare')) h.setAttribute('data-bare', '');
})();
</script>

// NEW: GitHub contributions, the canvas card's grid as a server-rendered block inside Work.
// SAMPLE data: a seeded pseudo-random year. The build reads lib/github.ts and renders nothing without a token.
function contrib() {
  var seed = 7, rnd = function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  var end = new Date(Date.UTC(2026, 10, 27)), start = new Date(end); start.setUTCDate(start.getUTCDate() - 364 - end.getUTCDay());
  var weeks = [], months = [], total = 0, d = new Date(start), lastM = -1;
  for (var w = 0; w < 53; w++) {
    var col = [];
    for (var i = 0; i < 7; i++) {
      if (d > end) { col.push(null); } else {
        var r = rnd(), wk = (d.getUTCDay() === 0 || d.getUTCDay() === 6) ? 0.55 : 1, n = r < 0.28 * wk ? 0 : Math.floor(Math.pow(rnd(), 1.8) * 14 * wk) + 1;
        total += n; col.push(n === 0 ? 0 : n < 3 ? 1 : n < 6 ? 2 : n < 10 ? 3 : 4);
        if (i === 0 && d.getUTCMonth() !== lastM) { if (w < 51 && (!months.length || w - months[months.length - 1][0] >= 3)) months.push([w, d.toLocaleString('en-GB', { month: 'short', timeZone: 'UTC' })]); lastM = d.getUTCMonth(); }
      }
      d.setUTCDate(d.getUTCDate() + 1);
    }
    weeks.push(col);
  }
  var cells = weeks.map(function (c) { return c.map(function (l) { return l === null ? '<i class="gh__d gh__d--pad"></i>' : '<i class="gh__d"' + (l ? ' data-l="' + l + '"' : '') + '></i>'; }).join(''); }).join('');
  return '<div class="contrib" id="contrib">' +
    '<div class="contrib__head"><h3>On GitHub this year</h3><p><strong>' + total.toLocaleString('en-GB') + '</strong> contributions in the last year.</p></div>' +
    '<div class="gh"><div class="gh__scroll" data-scroll-x><div class="gh__in">' +
      '<div class="gh__months" aria-hidden="true">' + months.map(function (m) { return '<span style="grid-column:' + (m[0] + 1) + '/span 4">' + m[1] + '</span>'; }).join('') + '</div>' +
      '<div class="gh__grid" role="img" aria-label="' + total + ' contributions in the last year, one square a day">' + cells + '</div>' +
    '</div></div>' +
    '<div class="gh__foot"><a href="https://github.com/aahil-khan">aahil-khan</a><span class="gh__key">Less <i class="gh__d"></i><i class="gh__d" data-l="1"></i><i class="gh__d" data-l="2"></i><i class="gh__d" data-l="3"></i><i class="gh__d" data-l="4"></i> More</span></div>' +
    '</div></div>';
}

        '</article></div>' + labFoot('') + '</div>';
    } },

  var LAB_C = '#C9DDF7', LAB_T = '#EAF2FC';   // proposed: a glass blue, apart from the Words lavender

function ogCard(kind, look) {

    '<div class="og-bar"><span class="og-ak">AK</span><span class="og-path">' + c.path + '</span></div>' +
    '<div class="og-body' + (c.side ? ' has-still' : '') + '"><div class="og-main">' + c.main +
      '<p class="og-foot">' + c.foot + '<span class="who">Aahil Khan</span></p></div>' + (c.side || '') + '</div>' +
    '</div></div></div><figcaption>' + look[0] + '</figcaption></figure>';
}
function renderCards() {

    '<p>What a Lab link looks like when it is pasted into LinkedIn, X or WhatsApp. Each is drawn at 1200 × 630 and scaled down here. Titles and dates are sample content.</p>' +
    CARD_KINDS.map(function (k) {

    }).join('') + '</div>';
}
function fitCards() {

}

// ---------- colophon ----------
function facts(rows) {

function citeBox() {
  return '<div class="box cite"><div class="window-bar"><span>Cite an entry</span><span class="sample-flag">sample entry</span></div>' +
    '<pre>Khan, Aahil. “An agent can’t leak a price it never sees.” The Lab, 26 November 2026. https://aahil-khan.xyz/lab/studies/shopkeeper/05</pre></div>';

function renderColophon() {
  return '<div class="lab">' + labBar(false) + '<div class="page"><article class="prose">' +
    '<p class="eyebrow">Aahil Khan · Colophon</p><h1 class="title">How this site is made</h1>' +

    '<h2>Type</h2>' + facts([['Space Grotesk', 'Florian Karsten. Every heading and paragraph.', 'SIL Open Font License 1.1'], ['Space Mono', 'Colophon Foundry. Code, and nothing else.', 'SIL Open Font License 1.1'], ['Caveat', 'Pablo Impallari. Dates, by hand.', 'SIL Open Font License 1.1']]) +
    '<h2>Code</h2>' + facts([['Next.js and React', 'The framework and the renderer.', 'MIT'], ['Motion', 'Every enter, exit and page change in the Lab.', 'MIT'], ['Lenis', 'Smooth scrolling on desktop.', 'MIT'],
      ['GSAP', 'The scroll-linked motion on the front page.', 'GSAP Standard License'], ['Floating UI', 'Where a preview window opens.', 'MIT'], ['unified, remark and rehype', 'Lab pages, from Markdown to HTML at build time.', 'MIT'],
      ['Shiki', 'Code highlighting, at build time.', 'MIT'], ['feed', 'The RSS and Atom feeds.', 'MIT']]) +
    '<p>The desk uses none of these beyond Next and React: its pan, zoom, drag and animation are written by hand.</p>' +
    '<h2>Sound</h2>' + facts([['Interface cues and noise', 'Synthesised in the browser with Web Audio. There are no sound files.', 'made here'],
      ['Radio', 'Six public internet stations, streamed from their own servers and named in the Sound menu.', 'theirs'],
      ['His name', 'Spoken by Kokoro-82M, voice af_heart, rendered once to one small file.', 'Apache 2.0']]) +

    '<h2>Inspired by</h2><p><a href="https://yevtam.com">yevtam.com</a> for the dock and the cursor, and <a href="https://ajvadlaseen.com">ajvadlaseen.com</a> for the type, borders and shadows. Everything else is mine.</p>' +
    '<h2>How to cite</h2><p>Name the page, its date and its address. Every Lab page shows the date it was written and the date it last changed; cite the one you read.</p>' + citeBox() +
    '</article></div>' + labFoot('/colophon') + '</div>';
}

// ---------- For AI agents ----------
function renderAgents() {
  var ep = function (path, text) { return '<li class="box"><div class="window-bar"><code>' + path + '</code></div><p>' + text + '</p></li>'; };
  return '<div class="lab">' + labBar(false) + '<div class="page"><article class="prose">' +
    '<p class="eyebrow">Aahil Khan · For AI agents</p><h1 class="title">For AI agents</h1>' +
    '<p class="lede">If you are a model reading this site, or building one that does: every page has a plain-text version, and this page says where they are.</p>' +
    '<h2>Where the text is</h2><ul class="endpoints">' +
      ep('/llms.txt', 'The map: every page, one line each, in the llmstxt.org format.') +
      ep('/llms-full.txt', 'Every page’s text in one file, for reading the whole site at once.') +
      ep('&lt;any page&gt;.md', 'Add .md to any address for that page as Markdown, with absolute links. Each page also names it in a link tag.') +
      ep('/feed.xml', 'New Lab pages as RSS and Atom, newest first.') +
    '</ul>' +
    '<h2>Fetch one</h2><div class="box cite"><div class="window-bar"><span>A Lab page, as Markdown</span><span class="sample-flag">sample entry</span></div><pre>curl https://aahil-khan.xyz/lab/studies/shopkeeper/05.md</pre></div>' +
    '<h2>Using what you read</h2><p>Quote and summarise freely, with a link to the page. Say when a page is dated or marked as a draft: the dates are there so a reader can tell what is current.</p>' +
    '<h2>How to cite</h2>' + citeBox() +
    '</article></div>' + labFoot('/agents') + '</div>';
}

// ---------- the name, six takes ----------
var TAKES = [
  { k: 'plain', n: 1, name: 'Plain', fed: 'the text <code>Aahil Khan</code>', ph: 'ˈɑːhɪl kˈɑːn', s: 0.98, kb: 5.8 },
  { k: 'respell', n: 2, name: 'Respelled', fed: 'the text <code>Aa-hil Khaan</code>', ph: 'ˈɑːhˈɪl kˈɑːən', s: 0.96, kb: 5.7 },
  { k: 'respell2', n: 3, name: 'Respelled again', fed: 'the text <code>Ah-hill Khahn</code>', ph: 'ˈɑːhˈɪl kˈɑːhn', s: 0.98, kb: 5.9 },
  { k: 'sentence', n: 4, name: 'In a sentence', fed: 'the text <code>Hi, I’m Aahil Khan.</code>', ph: 'hˈaɪ, aɪm ˈɑːhɪl kˈɑːn', s: 1.39, kb: 8.3 },

  { k: 'ipa-long', n: 6, name: 'Phonemes, long i', fed: 'the phonemes directly, with a long i and the Urdu kh', ph: 'ɑːhˈiːl xˈɑːn', s: 1.0, kb: 5.9 },
];
function renderVoices() {
  return '<div class="lab">' + labBar(false) + '<div class="page"><article>' +
    '<p class="eyebrow">Mockup · the name</p><h1 class="title">Six takes of “Aahil”</h1>' +
    '<p class="lede">Kokoro-82M, voice af_heart, rendered from six inputs. Play each and pick one by ear. The build plays the one you pick, trimmed to the first name, for the AH-hil tooltip.</p>' +
    '<ol class="takes">' + TAKES.map(function (t) {
      return '<li class="box take" data-take="' + t.k + '"><button type="button" class="play" aria-label="Play take ' + t.n + ', ' + t.name + '">' + ICON.play + '</button>' +
        '<h3><span class="n">TAKE ' + t.n + '</span>' + t.name + '</h3>' +
        '<p class="fed">Fed ' + t.fed + '; spoken as <code>' + t.ph + '</code></p>' +
        '<p class="facts-mini">' + t.s.toFixed(2) + ' s<br>' + t.kb.toFixed(1) + ' KB Opus</p>' +
        '<div class="use"><button type="button" data-pick="' + t.k + '" aria-pressed="' + (t.k === 'plain') + '">Use on the name</button>' +
        (t.same ? '<span class="same">The same audio as take ' + t.same + ', to the byte: Kokoro reads the plain spelling as exactly these phonemes.</span>' : '') + '</div>' +
        '<audio preload="auto" src="' + asset(t.k) + '"></audio></li>';
    }).join('') + '</ol>' +
    '<div class="box namedemo"><div class="window-bar"><span>On the name</span><span class="meta" data-picked>take 1</span></div><div class="in">' +
      '<p>I’m <button type="button" class="name" aria-describedby="name-tip">Aahil</button>. I don’t take myself seriously, but I take my projects very seriously.</p>' +
      '<p class="meta" style="margin-top:10px">Hover the name, or focus it and press Enter.</p></div></div>' +
    '</article></div>' + labFoot('') + '</div>';
}
function wireVoices() {
  var playing = null, picked = 'plain';
  var stop = function () { if (playing) { playing.audio.pause(); playing.audio.currentTime = 0; playing.li.classList.remove('is-playing'); playing = null; } };
  document.querySelectorAll('.take').forEach(function (li) {
    var a = li.querySelector('audio'), b = li.querySelector('.play');
    b.addEventListener('click', function () {
      var was = playing && playing.li === li; stop(); if (was) return;
      playing = { li: li, audio: a }; li.classList.add('is-playing'); a.play();
    });
    a.addEventListener('ended', function () { if (playing && playing.li === li) { li.classList.remove('is-playing'); playing = null; } });
  });
  document.querySelectorAll('[data-pick]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      picked = btn.dataset.pick;
      document.querySelectorAll('[data-pick]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === btn)); });
      document.querySelector('[data-picked]').textContent = 'take ' + TAKES.filter(function (t) { return t.k === picked; })[0].n;
    });
  });
  var name = document.querySelector('button.name'), tip;
  var say = function () { stop(); var a = document.querySelector('[data-take="' + picked + '"] audio'); a.currentTime = 0; a.play(); };
  var show = function () {
    if (!tip) { tip = document.createElement('span'); tip.className = 'name-tip'; tip.id = 'name-tip'; tip.setAttribute('role', 'tooltip'); tip.textContent = 'AH-hil'; document.body.appendChild(tip); }
    var r = name.getBoundingClientRect(); tip.hidden = false;
    tip.style.left = (r.left + scrollX) + 'px'; tip.style.top = (r.top + scrollY - 44) + 'px';
  };
  var hide = function () { if (tip) tip.hidden = true; };
  name.addEventListener('mouseenter', function () { show(); say(); });
  name.addEventListener('mouseleave', hide);
  name.addEventListener('focus', show);
  name.addEventListener('blur', hide);
  name.addEventListener('click', say);
}

      '<li>The share cards: Paper, Premium Day or Premium Night, as the one look every card uses.</li>' +

      '<li>Back to the desk on a phone: its own row under the bar, as drawn.</li>' +
      '<li>The Lab tile’s colour on the desk (a glass blue, #C9DDF7, is proposed).</li>' +
      '<li>The usage note on For AI agents, which is yours to write.</li>' +
    '</ol></div></div>';
}

var app = document.getElementById('app');

document.title = (v ? v.title : 'Index') + ' · Lab extras';

tag.innerHTML = v ? '<span>Mockup · ' + esc(v.title) + '</span><a href="?">All views</a>' : '<span>Mockup · Lab extras</span>';
if (VIEW === 'cards') { fitCards(); addEventListener('resize', fitCards); }
if (VIEW === 'voices') wireVoices();

if (v && v.scrollTo) {
  var target = document.getElementById(v.scrollTo);
  var place = function () { var y = target.getBoundingClientRect().top + scrollY - (VIEW === 'site-band' ? 190 : 120); scrollTo(0, Math.max(0, y)); };
  document.fonts.ready.then(place);
}
document.fonts.ready.then(function () { document.documentElement.setAttribute('data-ready', '1'); });
})();
