// The one owner of the view and the look, before first paint. Query params only:
//   ?view=<id>   one of VIEWS below; none = the index of every view
//   ?look=paper|lab  ?theme=cream|tokyo-night (Paper and the site)  ?mode=light|dark (the Lab theme)
//   ?bare        hides the mockup's corner tag, for screenshots and the check
(function () {
  var q = new URLSearchParams(location.search), h = document.documentElement;
  var view = q.get('view') || 'index';
  var family = { 'site-nav': 'site', 'site-band': 'site', 'site-contrib': 'site', 'canvas-lab': 'site' }[view] || 'lab';
  var look = family === 'lab' && q.get('look') === 'lab' ? 'lab' : 'paper';
  var theme = q.get('theme') === 'tokyo-night' ? 'tokyo-night' : 'cream';
  if (view === 'index' || view === 'cards') { look = 'paper'; theme = 'cream'; }
  h.setAttribute('data-view', view);
  h.setAttribute('data-look', look);
  if (look === 'lab') { h.removeAttribute('data-theme'); h.setAttribute('data-mode', q.get('mode') === 'light' ? 'light' : 'dark'); }
  else h.setAttribute('data-theme', theme);
  if (q.has('bare')) h.setAttribute('data-bare', '');
})();
</script>

// NEW: GitHub contributions, the canvas card's grid as a server-rendered block inside Work.
// SAMPLE data: a seeded pseudo-random year. The build reads lib/github.ts and renders nothing without a token.
function contrib() {
  var seed = 7, rnd = function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  var end = new Date(Date.UTC(2026, 10, 27)), start = new Date(end); start.setUTCDate(start.getUTCDate() - 364 - end.getUTCDay());
  var weeks = [], months = [], total = 0, d = new Date(start), lastM = -1;
  for (var w = 0; w < 53; w++) {
    var col = [];
    for (var i = 0; i < 7; i++) {
      if (d > end) { col.push(null); } else {
        var r = rnd(), wk = (d.getUTCDay() === 0 || d.getUTCDay() === 6) ? 0.55 : 1, n = r < 0.28 * wk ? 0 : Math.floor(Math.pow(rnd(), 1.8) * 14 * wk) + 1;
        total += n; col.push(n === 0 ? 0 : n < 3 ? 1 : n < 6 ? 2 : n < 10 ? 3 : 4);
        if (i === 0 && d.getUTCMonth() !== lastM) { if (w < 51 && (!months.length || w - months[months.length - 1][0] >= 3)) months.push([w, d.toLocaleString('en-GB', { month: 'short', timeZone: 'UTC' })]); lastM = d.getUTCMonth(); }
      }
      d.setUTCDate(d.getUTCDate() + 1);
    }
    weeks.push(col);
  }
  var cells = weeks.map(function (c) { return c.map(function (l) { return l === null ? '<i class="gh__d gh__d--pad"></i>' : '<i class="gh__d"' + (l ? ' data-l="' + l + '"' : '') + '></i>'; }).join(''); }).join('');
  return '<div class="contrib" id="contrib">' +
    '<div class="contrib__head"><h3>On GitHub this year</h3><p><strong>' + total.toLocaleString('en-GB') + '</strong> contributions in the last year.</p></div>' +
    '<div class="gh"><div class="gh__scroll" data-scroll-x><div class="gh__in">' +
      '<div class="gh__months" aria-hidden="true">' + months.map(function (m) { return '<span style="grid-column:' + (m[0] + 1) + '/span 4">' + m[1] + '</span>'; }).join('') + '</div>' +
      '<div class="gh__grid" role="img" aria-label="' + total + ' contributions in the last year, one square a day">' + cells + '</div>' +
    '</div></div>' +
    '<div class="gh__foot"><a href="https://github.com/aahil-khan">aahil-khan</a><span class="gh__key">Less <i class="gh__d"></i><i class="gh__d" data-l="1"></i><i class="gh__d" data-l="2"></i><i class="gh__d" data-l="3"></i><i class="gh__d" data-l="4"></i> More</span></div>' +
    '</div></div>';
}

}

function renderVoices() {
  var bar = function (t) { var max = 0.4; return '<span class="syl" aria-hidden="true"><i style="width:' + Math.round(t.aa / max * 100) + '%"></i><i style="width:' + Math.round(t.hil / max * 100) + '%"></i></span>'; };
  return '<div class="lab">' + labBar(false) + '<div class="page"><article>' +
    '<p class="eyebrow">Mockup · the name</p><h1 class="title">“Aahil”, in new voices</h1>' +
    '<p class="lede">The Kokoro takes said it right and sounded wrong, so one stays as the reference for how it should sound, and the rest are free voices that run on this machine: Piper’s Hindi and other Indian male voices. Each keeps the AA-hil balance, two syllables within a quarter of each other’s length, measured from the waveform.</p>' +
    GROUPS.map(function (g) {
      return '<h2 class="takes-h">' + g[1] + '</h2><ol class="takes">' + TAKES.filter(function (t) { return t.g === g[0]; }).map(function (t) {
        var n = TAKES.indexOf(t) + 1;
        return '<li class="box take" data-take="' + t.k + '"><button type="button" class="play" aria-label="Play take ' + n + ', ' + t.engine + ' ' + t.voice + '">' + ICON.play + '</button>' +
          '<h3><span class="n">TAKE ' + n + '</span>' + t.engine + ' · ' + t.voice + ' ' + (t.input ? '<span class="in-txt" lang="hi">' + t.input + '</span>' : '') + '</h3>' +
          '<p class="fed">From ' + t.how + ', spoken as <code>' + t.ph + '</code>, ' + t.sp + ' · <span class="lic">' + t.lic + '</span></p>' +
          '<p class="facts-mini">aa ' + t.aa.toFixed(2) + ' s · hil ' + t.hil.toFixed(2) + ' s' + bar(t) + t.kb.toFixed(1) + ' KB Opus</p>' +
          '<div class="use"><button type="button" data-pick="' + t.k + '" aria-pressed="' + (t.k === pickedTake()) + '">Use on the name</button></div>' +
          '<audio preload="auto" src="' + asset(t.k) + '"></audio></li>';
      }).join('') + '</ol>';
    }).join('') +
    '<div class="box namedemo"><div class="window-bar"><span>On the name</span><span class="meta" data-picked></span></div><div class="in">' + nameLine('say-demo', null) +
      '<p class="meta" style="margin-top:10px">Hover the name, then press the voice bubble.</p></div></div>' +
    '</article></div>' + labFoot('') + '</div>';
}
function wireVoices() {
  var playing = null;
  var stop = function () { if (playing) { playing.audio.pause(); playing.audio.currentTime = 0; playing.li.classList.remove('is-playing'); playing = null; } };
  var label = function () { var k = pickedTake(); document.querySelector('[data-picked]').textContent = 'take ' + (TAKES.findIndex(function (t) { return t.k === k; }) + 1); };
  document.querySelectorAll('.take').forEach(function (li) {
    var a = li.querySelector('audio'), b = li.querySelector('.play');
    b.addEventListener('click', function () {
      var was = playing && playing.li === li; stop(); if (was) return;
      playing = { li: li, audio: a }; li.classList.add('is-playing'); a.play();
    });
    a.addEventListener('ended', function () { if (playing && playing.li === li) { li.classList.remove('is-playing'); playing = null; } });
  });
  document.querySelectorAll('[data-pick]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      try { localStorage.setItem('extras.take', btn.dataset.pick); } catch (e) { /* private mode */ }
      document.querySelectorAll('[data-pick]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === btn)); });
      label();
    });
  });
  label();
  wireName(document);
}

// The hover, drawn open twice: at rest, and while the clip plays (the dots move).
function renderNameHover() {
  var spec = function (state, title, note) {
    return '<section class="box hover-spec"><div class="window-bar"><span>' + title + '</span><span class="meta">' + note + '</span></div><div class="in">' +
      nameLine('say-' + state, state) + '</div></section>';
  };
  return '<div class="lab">' + labBar(false) + '<div class="page"><article>' +
    '<p class="eyebrow">Mockup · the name, on hover</p><h1 class="title">Aahil, on hover</h1>' +
    '<p class="lede">Hovering his name shows it in Devanagari and Arabic script, with a voice bubble. Pressing the bubble plays the name, and its dots move for as long as the clip lasts. Nothing plays on hover.</p>' +
    '<div class="hover-specs">' + spec('open', 'Hovering', 'the bubble waits') + spec('playing', 'Playing', 'after a press on the bubble') + '</div>' +
    '<p class="confirm"><span class="sample-flag">spelling to confirm</span> <span lang="hi" class="cf-dev">आहिल</span> in Devanagari, <span lang="ar" dir="rtl" class="cf-ar">عاهل</span> in Arabic script.</p>' +
    '</article></div>' + labFoot('') + '</div>';
}

// ---------- the index ----------
function renderIndex() {
  return '<div class="ix"><h1>The surfaces the mockup never drew</h1>' +
    '<p>Plan plan-the-real-lab, PR 3. A static proof of every door into the Lab, the share cards, the colophon, For AI agents, GitHub contributions on /, and the six takes of the name, for a verdict before any of it is built in React.</p>' +
    '<p>Every entry title, date and count is sample content: the real Lab starts empty and shows demo content until Aahil adds his own. Judge the surfaces, not the words in them.</p>' +
    '<div class="ix-grid">' + Object.keys(VIEWS).map(function (id) {
      var v = VIEWS[id];
      return '<div class="ix-card"><h2>' + esc(v.title) + '</h2><p>' + esc(v.what) + '</p><ul>' + v.looks.map(function (l) {
        return '<li><a href="?view=' + id + (l[1] ? '&' + l[1] : '') + '">' + esc(l[0]) + '</a></li>';
      }).join('') + '</ul></div>';
    }).join('') + '</div>' +
    '<div class="ix-decide"><h2>What to decide in round 3</h2><ol>' +
      '<li>The voice: one of the eight new takes, by ear, against the Kokoro reference.</li>' +
      '<li>The two spellings, आहिल and عاهل.</li>' +
      '<li>The share cards’ look: Paper, or the Lab theme in Light or Dark.</li>' +
    '</ol><p>Approved: the band, the Lab tile’s colour, the agents note (round 1), and the one-line hover (round 3).</p></div></div>';
}

// ---------------------------------------------------------------------------------------------
var app = document.getElementById('app');
var v = VIEWS[VIEW];
app.innerHTML = v ? '<div class="view">' + v.render() + '</div>' : renderIndex();
document.title = (v ? v.title : 'Index') + ' · Lab extras';
var tag = document.getElementById('mock-tag');
tag.innerHTML = v ? '<span>Mockup · ' + esc(v.title) + '</span><a href="?">All views</a>' : '<span>Mockup · Lab extras</span>';
if (VIEW === 'cards') { fitCards(); addEventListener('resize', fitCards); }
if (VIEW === 'voices') wireVoices();
if (VIEW === 'name-hover') wireName(document);
if (VIEW === 'canvas-lab') addEventListener('resize', function () { if ((innerWidth < 760) !== !document.querySelector('.desk')) app.innerHTML = '<div class="view">' + renderDesk() + '</div>'; });
if (v && v.scrollTo) {
  var target = document.getElementById(v.scrollTo);
  var place = function () { var y = target.getBoundingClientRect().top + scrollY - (VIEW === 'site-band' ? 190 : 120); scrollTo(0, Math.max(0, y)); };
  document.fonts.ready.then(place);
}
document.fonts.ready.then(function () { document.documentElement.setAttribute('data-ready', '1'); });
})();
</script>
</body>
